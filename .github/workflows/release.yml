name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        rid: [win-x64, linux-x64, osx-arm64]

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish LoadTester -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -o out/${{ matrix.rid }}

      - name: Zip
        run: |
          cd out/${{ matrix.rid }}
          zip -r ../../loadtest-${{ matrix.rid }}.zip .

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: loadtest-${{ matrix.rid }}.zip
